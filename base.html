<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Norgren - Órdenes</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; color: #17283b; background: #f5f7fa; }
        header { background: #172d48; color: white; }
        .navigation { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem 2rem; max-width: 1100px; margin: auto; padding: 1rem; }
        .brand { color: white; font-size: 1.25rem; font-weight: bold; text-decoration: none; }
        .menu { display: flex; flex-wrap: wrap; gap: .5rem; list-style: none; margin: 0; padding: 0; }
        .menu a { display: block; padding: .6rem .8rem; border-radius: .3rem; color: white; text-decoration: none; }
        .menu a:hover, .menu a:focus-visible, .menu a.active { background: #315779; }
        .menu a:focus-visible { outline: 2px solid white; outline-offset: 2px; }
        main { max-width: 1100px; margin: auto; padding: 1.5rem 1rem; }
    </style>
</head>
<body>
    <header>
        <nav class="navigation" aria-label="Navegación principal">
            <a class="brand" href="{% url 'orders:home' %}">Norgren</a>
            <ul class="menu">
                <li><a href="{% url 'orders:ordenes-list' %}"{% if route_name == 'ordenes' %} class="active"{% endif %}>Órdenes</a></li>
                <li><a href="{% url 'orders:clientes-list' %}"{% if route_name == 'clientes' %} class="active"{% endif %}>Clientes</a></li>
                <li><a href="{% url 'orders:productos-list' %}"{% if route_name == 'productos' %} class="active"{% endif %}>Productos</a></li>
            </ul>
        </nav>
    </header>
    <main>
        {% for message in messages %}<p role="alert">{{ message }}</p>{% endfor %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
